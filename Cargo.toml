[package]
name = "safe_trash"
version = "0.1.0"
edition = "2021"
description = "Fail-safe rm replacement backing up deleted files to a LUKS-encrypted vault"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"

[dev-dependencies]
tempfile = "3.10"
